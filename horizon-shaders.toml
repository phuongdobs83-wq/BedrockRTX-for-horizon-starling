# Settings pages (API 0.1-compatible layout)
[[pages]]
id = "main"
name = "BedrockRTX Settings"
items = ["page:lighting", "page:colored_lighting", "page:reflections", "page:water", "page:godrays", "page:aurora", "page:color"]

[[pages]]
id = "lighting"
name = "Lighting & Shadows"
columns = 1
items = ["shadow_enabled", "shadow_resolution", "shadow_distance", "shadow_strength", "shadow_softness", "shadow_color_style", "shadow_color_strength", "ambient_gi", "day_brightness", "ambient_brightness"]

[[pages]]
