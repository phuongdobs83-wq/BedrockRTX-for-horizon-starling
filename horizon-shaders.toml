schema = 1
id = "bedrock_rtx"
name = "BedrockRTX 0.2.0"
version = "0.2.0"
api = "0.1"
description = "BedrockRTX 0.2.0 Fix 11 Android API 0.1: wet-surface controls grouped under Wet Surfaces mode, automatic rain/storm shadow fade and recovery, Horizon reflection-buffer reflections, water waves and God Rays."
authors = ["BedrockRTX Project"]
license = "MIT"
shared = ["common.wgsl"]

[sky]
file = "sky.wgsl"
name = "BedrockRTX Atmosphere"
clouds = false
sun = false
stars = false

[material]
file = "material.wgsl"
name = "BedrockRTX Materials and Lighting"
fog = true

[vertex]
file = "vertex.wgsl"

[shadow]
resolution = 1024
distance = 60.0
option = "shadow_enabled"
resolution_option = "shadow_resolution"
distance_option = "shadow_distance"

[reflection]
option = "reflections_enabled"

# Ask the API 0.1 shadow pass to include the Nether portal surface as translucent.
[[materials]]
id = 1
blocks = ["nether_portal"]
translucent = true

[[post]]
file = "post.wgsl"
name = "BedrockRTX Reflections, Godrays and Color Studio"

[budget]
gpu_ms = 2.2


[[options]]
id = "shadow_enabled"
name = "Shadows"
type = "bool"
default = true

[[options]]
id = "shadow_resolution"
name = "Shadow Resolution"
type = "int"
min = 256
max = 1024
default = 512

[[options]]
id = "shadow_distance"
name = "Shadow Distance"
type = "int"
min = 32
max = 96
default = 48

[[options]]
id = "shadow_strength"
name = "Shadow Strength"
type = "float"
min = 0.0
max = 1.0
step = 0.05
default = 0.78

[[options]]
id = "shadow_softness"
name = "Shadow Softness"
type = "float"
min = 0.0
max = 1.0
step = 0.05
default = 0.0

[[options]]
